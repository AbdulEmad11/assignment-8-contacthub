<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ContactHub - Smart Contact Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="webfonts/fa-brands-400.woff2">
  <link rel="stylesheet" href="./css/all.min.css">
  <link rel="stylesheet" href="./css/bootstrap.css">

  <link rel="stylesheet" href="./css/style_sheet.css">
</head>
<body>

  <header class="navbar">
    <div class="container nav-inner">
      <div class="brand">
        <div class="brand-logo"><i class="fa-solid fa-address-book"></i></div>
        <div>
          <h1>Contact<span>Hub</span></h1>
          <p>Smart Contact Manager</p>
        </div>
      </div>
      <div class="nav-actions">
        <button class="btn-primary" id="openModalBtn"><i class="fa-solid fa-plus"></i> Add Contact</button>
        <button class="icon-btn" aria-label="Notifications"><i class="fa-solid fa-bell"></i></button>
        <button class="icon-btn" aria-label="Settings"><i class="fa-solid fa-gear"></i></button>
        <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="stats">
      <div class="stat-card">
        <div class="stat-icon blue"><i class="fa-solid fa-user-group"></i></div>
        <div><span class="stat-label">TOTAL</span><strong id="totalCount">0</strong></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange"><i class="fa-solid fa-star"></i></div>
        <div><span class="stat-label">FAVORITES</span><strong id="favCount">0</strong></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon red"><i class="fa-solid fa-heart-pulse"></i></div>
        <div><span class="stat-label">EMERGENCY</span><strong id="emgCount">0</strong></div>
      </div>
    </section>

    <section class="layout">
      <div class="contacts-col">
        <h2>All Contacts</h2>
        <p class="subtitle">Manage and organize your <span id="subCount">0</span> contacts</p>

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Search by name, phone, or email...">
        </div>

        <div id="contactsList" class="contacts-list"></div>
        <div id="emptyState" class="empty-state">
          <div class="empty-icon"><i class="fa-solid fa-address-book"></i></div>
          <h3>No contacts found</h3>
          <p>Click "Add Contact" to get started</p>
        </div>
      </div>

      <aside class="side-col">
        <div class="side-card">
          <div class="side-head fav-head">
            <div class="stat-icon orange sm"><i class="fa-solid fa-star"></i></div>
            <div><h3>Favorites</h3><p>Quick access to starred contacts</p></div>
          </div>
          <div id="favList" class="side-body"></div>
        </div>
        <div class="side-card">
          <div class="side-head emg-head">
            <div class="stat-icon red sm"><i class="fa-solid fa-heart-pulse"></i></div>
            <div><h3>Emergency</h3><p>Important contacts for urgent calls</p></div>
          </div>
          <div id="emgList" class="side-body"></div>
        </div>
      </aside>
    </section>
  </main>


  <div class="modal" id="contactModal">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modalTitle">Add Contact</h3>
        <button class="icon-btn" id="closeModalBtn" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="contactForm" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" placeholder="e.g. Ahmed Ali">
          <small class="error" id="nameError"></small>
        </div>
        <div class="field">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" placeholder="e.g. 01012345678">
          <small class="error" id="phoneError"></small>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="e.g. ahmed@example.com">
          <small class="error" id="emailError"></small>
        </div>
        <div class="checks">
          <label><input type="checkbox" id="isFav"> <i class="fa-solid fa-star"></i> Add to favorites</label>
          <label><input type="checkbox" id="isEmg"> <i class="fa-solid fa-heart-pulse"></i> Emergency contact</label>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn-primary" id="saveBtn">Save contact</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/bootstrap.bundle.min.js"></script>
  <script src="./js/java.js"></script>
</body>
</html>
